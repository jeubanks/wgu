site_name: WGU Study Kits
site_url: https://jeubanks.github.io/wgu/
site_description: Unofficial practice for WGU courses. D427 has 151 MySQL exercises with quizzes, diagrams, and SQL you can run in your browser.
repo_url: https://github.com/jeubanks/wgu
edit_uri: edit/main/

# docs/d427 and docs/c949 are symlinks to the course folders,
# so the exercise files stay where the scripts and Docker setup expect them.
docs_dir: docs

# mkdocs serve doesn't follow the symlinks when watching for changes.
watch:
  - D427_Data_Management_Applications
  - C949_Data_Structures_And_Algorithms_I
  - hooks
  - includes
  - overrides

exclude_docs: |
  *.py
  *.ini
  .pytest_cache/
  __pycache__/

extra_css:
  - stylesheets/wgu.css
  - stylesheets/viz.css
  - stylesheets/cards.css

# The SQL runner on D427 Part 1 and the quiz on Part 4
# (hooks/sql_runner.py and hooks/quiz.py add their data to those pages).
extra_javascript:
  - javascripts/sql-runner.js
  - javascripts/quiz.js
  - javascripts/progress.js
  - javascripts/site.js
  - javascripts/drill.js
  - javascripts/viz.js
  - javascripts/practice.js

hooks:
  - hooks/er_diagrams.py
  - hooks/concept_diagrams.py
  - hooks/figures.py
  - hooks/details.py
  - hooks/sql_runner.py
  - hooks/quiz.py
  - hooks/progress.py
  - hooks/study_cards.py
  - hooks/page_footer.py
  - hooks/anchors.py
  - hooks/redirects.py

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  # The exercise files indent list content by 2 spaces (GitHub style).
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - toc:
      permalink: true
      # Match GitHub's heading anchors so in-page links work in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  # ```mermaid blocks become diagrams (Material themes them for light and dark).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Glossary tooltips: includes/glossary.md (outside docs/, so it isn't a page)
  # is added to the end of every page, and its *[TERM]: definitions underline
  # each TERM in the text with a tooltip. Terms are case-sensitive.
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Courses: each is a folder symlinked into docs/ under its slug (docs/d427 ->
# D427_Data_Management_Applications). The build hooks read these settings to
# decide which pages get which features; see AUTHORING.md for each one.
extra:
  courses:
    d427:
      folder: D427_Data_Management_Applications
      # Done boxes on every exercise, and a bar per part on the overview page.
      progress:
        overview: exercises.md
        pages: "0[0-9]-*.md"
      # Study-card layout on the parts (hooks/study_cards.py). Section titles
      # already carry their numbers, so no badges.
      cards:
        pages: "0[0-9]-*.md"
        label: Part
        badges: false
        reading: false
        sections: true
        noun: exercise
        # Sections are mostly exercise cards, so no card around them (cards in
        # cards run together): each ## heading is a banner instead.
        wrap: false
        groups:
          # One color for the whole course: C949's indigo, teal, and amber mean
          # its competencies, so D427 doesn't reuse them.
          practice: {title: D427 Data Management, pages: [1, 2, 3, 4, 5]}
      # Sample data for the ER diagrams, concept diagrams, and SQL runner.
      setup_sql: setup.sql
      # "Show tables" diagrams; the full diagram replaces the Mermaid block in readme.
      er_diagrams:
        readme: README.md
        pages: [01-queries.md, 02-changing-data.md, 03-practice-test-drills.md, 05-final-practice.md]
      # join-diagram / delete-diagram / tree-diagram blocks.
      concept_diagrams: true
      # Try it boxes: page -> sections. Read-only queries, except the sections in
      # changes: there each box starts from the earlier exercises' solutions, and
      # Check compares the tables.
      sql_runner:
        pages:
          01-queries.md: [1, 2, 3, 4, 5, 6]
          02-changing-data.md: [7]
          03-practice-test-drills.md: [12]
        changes: [7]
        skip:
          "12.20": This one changes data, so do it on MySQL.
          "12.21": This one changes data, so do it on MySQL.
          "12.22": This one changes data, so do it on MySQL.
          "12.23": This one changes data, so do it on MySQL.
      # Interactive answer keys (<!-- answer:... --> comments).
      quiz: 04-concepts-check.md
    c949:
      folder: C949_Data_Structures_And_Algorithms_I
      # Done boxes on every chapter question, and a bar per chapter on the contents page.
      progress:
        overview: README.md
        pages: "[0-9][0-9]-*.md"
      # Every chapter page ends with interactive questions (<!-- answer:... --> comments).
      quiz: "[0-9][0-9]-*.md"
      # The course was published as d949 before; old links redirect here.
      old_slugs: [d949]
      # The v5 restructure renumbered every question, so saved progress starts fresh.
      storage: c949v5
      # Study-card layout on the topic pages: header card, section cards, and
      # one accent color per competency (hooks/study_cards.py).
      cards:
        pages: "[0-9][0-9]-*.md"
        label: Page
        groups:
          explains: {title: Explains Algorithms, pages: [1, 2, 3, 4]}
          impact: {title: Determines Data Structure Impact, pages: [5, 6, 7, 8, 9]}
          applies: {title: Applies Algorithms, pages: [10]}
          practice: {title: All competencies, pages: [11]}
      # The Python lessons moved under code/; old links redirect there.
      moved:
        exercises.md: code/README.md
        01-big-o.md: code/01-big-o.md
        02-lists-stacks-queues.md: code/02-lists-stacks-queues.md
        03-hash-tables.md: code/03-hash-tables.md
        04-trees-heaps.md: code/04-trees-heaps.md
        05-searching-sorting.md: code/05-searching-sorting.md
        06-graphs.md: code/06-graphs.md
        07-tracing.md: code/07-tracing.md
        # v5 restructure: the zyBooks-chapter pages were merged into topic pages.
        01-introduction.md: 05-adts.md
        02-lists.md: 06-lists-stacks-queues.md
        03-stacks-queues.md: 06-lists-stacks-queues.md
        04-hash-tables.md: 07-hash-tables.md
        05-trees.md: 08-trees-heaps.md
        06-balanced-trees.md: beyond-the-guide.md
        07-heaps-treaps.md: 08-trees-heaps.md
        08-sets.md: 09-sets-graphs.md
        09-graphs.md: 09-sets-graphs.md
        10-b-trees.md: beyond-the-guide.md
        11-algorithm-analysis.md: 04-algorithm-analysis.md
        12-programming-concepts.md: 10-programming-basics.md
        21-recursion.md: 01-tracing-code.md
        22-final-practice.md: 11-final-practice.md

nav:
