          - 6. Lists, stacks, and queues: c949/06-lists-stacks-queues.md
          - 7. Hash tables: c949/07-hash-tables.md
          - 8. Trees and heaps: c949/08-trees-heaps.md
          - 9. Sets and graphs: c949/09-sets-graphs.md
      - "Applies Algorithms":
          - 10. Programming basics: c949/10-programming-basics.md
      - Final practice: c949/11-final-practice.md
      - Beyond the guide: c949/beyond-the-guide.md
      - Practice quiz: c949/practice-quiz.md
      - Topic map: c949/topics.md
      - Big-O cheat sheet: c949/big-o.md
      - Tracing pseudocode: c949/code/07-tracing.md
      - Practice in code:
          - Overview: c949/code/README.md
          - Lesson 1 – Big-O: c949/code/01-big-o.md
          - Lesson 2 – Lists, stacks, queues: c949/code/02-lists-stacks-queues.md
          - Lesson 3 – Hash tables: c949/code/03-hash-tables.md
          - Lesson 4 – Trees and heaps: c949/code/04-trees-heaps.md
          - Lesson 5 – Searching and sorting: c949/code/05-searching-sorting.md
          - Lesson 6 – Graphs: c949/code/06-graphs.md
          - Lesson 7 – Tracing pseudocode: c949/code/07-tracing.md
