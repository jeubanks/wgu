site_name: WGU Study Kits
site_url: https://jeubanks.github.io/wgu/
site_description: Unofficial practice for WGU courses. D427 has 151 MySQL exercises with quizzes, diagrams, and SQL you can run in your browser.
repo_url: https://github.com/jeubanks/wgu
edit_uri: edit/main/

# docs/d427 and docs/d949 are symlinks to the course folders,
# so the exercise files stay where the scripts and Docker setup expect them.
docs_dir: docs

# mkdocs serve doesn't follow the symlinks when watching for changes.
watch:
  - D427_Data_Management_Applications
  - D949_Data_Structures_And_Algorithms_I
  - hooks
  - includes
  - overrides

exclude_docs: |
  *.py
  *.ini
  .pytest_cache/
  __pycache__/

extra_css:
  - stylesheets/wgu.css

# The SQL runner on D427 Part 1 and the quiz on Part 4
# (hooks/sql_runner.py and hooks/quiz.py add their data to those pages).
extra_javascript:
  - javascripts/sql-runner.js
  - javascripts/quiz.js
  - javascripts/progress.js
  - javascripts/site.js
  - javascripts/drill.js

hooks:
  - hooks/er_diagrams.py
  - hooks/concept_diagrams.py
  - hooks/details.py
  - hooks/sql_runner.py
  - hooks/quiz.py
  - hooks/progress.py
  - hooks/page_footer.py
  - hooks/anchors.py

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  # The exercise files indent list content by 2 spaces (GitHub style).
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - toc:
      permalink: true
      # Match GitHub's heading anchors so in-page links work in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  # ```mermaid blocks become diagrams (Material themes them for light and dark).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Glossary tooltips: includes/glossary.md (outside docs/, so it isn't a page)
  # is added to the end of every page, and its *[TERM]: definitions underline
  # each TERM in the text with a tooltip. Terms are case-sensitive.
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Courses: each is a folder symlinked into docs/ under its slug (docs/d427 ->
# D427_Data_Management_Applications). The build hooks read these settings to
# decide which pages get which features; see AUTHORING.md for each one.
extra:
  courses:
    d427:
      folder: D427_Data_Management_Applications
      # Done boxes on every exercise, and a bar per part on the overview page.
      progress:
        overview: exercises.md
        pages: "0[0-9]-*.md"
      # Sample data for the ER diagrams, concept diagrams, and SQL runner.
      setup_sql: setup.sql
      # "Show tables" diagrams; the full diagram replaces the Mermaid block in readme.
      er_diagrams:
        readme: README.md
        pages: [01-queries.md, 02-changing-data.md, 03-practice-test-drills.md, 05-final-practice.md]
      # join-diagram / delete-diagram / tree-diagram blocks.
      concept_diagrams: true
      # Try it boxes: page -> sections. Only read-only queries.
      sql_runner:
        pages:
          01-queries.md: [1, 2, 3, 4, 5, 6]
          03-practice-test-drills.md: [12]
        skip:
          "12.20": This one changes data, so do it on MySQL.
          "12.21": This one changes data, so do it on MySQL.
          "12.22": This one changes data, so do it on MySQL.
      # Interactive answer keys (<!-- answer:... --> comments).
      quiz: 04-concepts-check.md
    d949:
      folder: D949_Data_Structures_And_Algorithms_I

nav:
  - Home: index.md
  - D427 Data Management:
      - Overview: d427/exercises.md
      - Setup: d427/README.md
      - Part 1 – Querying data: d427/01-queries.md
      - Part 2 – Changing data: d427/02-changing-data.md
      - Part 3 – Practice-test drills: d427/03-practice-test-drills.md
      - Part 4 – Concepts check: d427/04-concepts-check.md
      - Part 5 – Final practice: d427/05-final-practice.md
      - Beyond D427: d427/later-advanced-sql.md
      - SQL quick reference: d427/quick-reference.md
      - Spec-to-type drill: d427/drill.md
      - Error decoder: d427/errors.md
  - D949 Data Structures:
      - Overview: d949/README.md
      - Python practice: d949/c949-practice/README.md
